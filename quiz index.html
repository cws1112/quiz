<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>반짝 퀴즈 챌린지</title>
  <style>
    :root {
      font-family: system-ui, "Malgun Gothic", sans-serif;
      color: #f2f4ff;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 15%, #42317c66, transparent 38%),
        radial-gradient(circle at 88% 84%, #11696955, transparent 40%),
        #0c1020;
    }
    .app {
      width: min(100%, 650px);
      padding: clamp(24px, 5vw, 42px);
      background: linear-gradient(150deg, #20253c, #171c2f 70%);
      border: 1px solid #3c4565;
      border-radius: 26px;
      box-shadow: 0 24px 70px #05081499, inset 0 1px #ffffff14;
    }
    .hidden { display: none !important; }
    .tag {
      display: inline-block;
      padding: 8px 13px;
      border: 1px solid #8167e888;
      border-radius: 40px;
      background: #694bc533;
      color: #d3c5ff;
      font-size: .85rem;
      font-weight: 800;
    }
    h1 { margin: 18px 0 10px; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.035em; }
    h2 {
      margin: 22px 0;
      font-size: clamp(1.3rem, 4vw, 1.7rem);
      line-height: 1.45;
    }
    p { line-height: 1.65; }
    .muted, .note { color: #b2bdd8; }
    .note { min-height: 25px; }
    label { display: block; margin: 25px 0 10px; font-weight: 750; }
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #606b91;
      border-radius: 13px;
      background: #11172a;
      color: #f2f4ff;
      font: inherit;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, select:focus-visible {
      outline: 3px solid #ffd166;
      outline-offset: 3px;
    }
    .primary, .secondary {
      padding: 14px 21px;
      border: 1px solid transparent;
      border-radius: 13px;
      font-weight: 800;
      transition: background .2s, transform .2s, border-color .2s;
    }
    .primary {
      color: #120d23;
      background: #c7a8ff;
      box-shadow: 0 5px 0 #563a82;
    }
    .primary:hover { background: #decaff; transform: translateY(-2px); }
    .secondary { color: #ddd3ff; background: #2c3150; border-color: #4d5178; }
    .secondary:hover { background: #3d4267; }
    .full { width: 100%; margin-top: 12px; }
    .top, .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .top { font-weight: 750; }
    .progress {
      height: 11px;
      margin: 22px 0;
      overflow: hidden;
      border-radius: 20px;
      background: #313650;
    }
    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #a87aff, #55e6c1);
      transition: width .25s;
    }
    .choices { display: grid; gap: 10px; }
    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      padding: 13px 15px;
      border: 1px solid #424a6b;
      border-radius: 15px;
      background: #222940;
      color: #f2f4ff;
      text-align: left;
      font-weight: 650;
      transition: background .2s, border-color .2s, transform .2s;
    }
    .choice:not(:disabled):hover {
      background: #313858;
      border-color: #b496ff;
      transform: translateX(3px);
    }
    .choice:disabled { cursor: default; opacity: 1; }
    .letter {
      flex: none;
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      color: #e4d8ff;
      background: #604d93;
    }
    .choice.correct {
      background: #153f39;
      border-color: #55dcb5;
      color: #c7ffed;
    }
    .choice.wrong {
      background: #4b263b;
      border-color: #ff91b3;
      color: #ffe3eb;
    }
    .feedback {
      margin: 19px 0;
      padding: 14px 17px;
      border: 1px solid transparent;
      border-radius: 15px;
      line-height: 1.65;
    }
    .feedback.good { background: #143b36; border-color: #38896f; color: #a8f5d8; }
    .feedback.bad { background: #492537; border-color: #ab5877; color: #ffbdd0; }
    .feedback strong { display: block; }
    .feedback p { margin: 6px 0 0; color: #f2f4ff; }
    .actions { margin-top: 22px; }
    .big {
      margin: 10px 0;
      color: #d5baff;
      font-size: clamp(2.7rem, 10vw, 4.8rem);
      font-weight: 900;
    }
    .summary {
      margin: 20px 0;
      padding: 15px 20px;
      border: 1px solid #454b70;
      border-radius: 17px;
      background: #272d48;
    }
    .summary p { margin: 6px 0; }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="intro" aria-labelledby="title">
      <span class="tag">✨ 지식 탐험 시작!</span>
      <h1 id="title">반짝 퀴즈 챌린지</h1>
      <p class="muted">난이도별 20문제 중 매번 5문제 출제 · 5지선다 · 정답마다 20점</p>

      <label for="difficulty">난이도 선택</label>
      <select id="difficulty">
        <option value="easy">하 · 초등학생</option>
        <option value="medium">중 · 중학생</option>
        <option value="hard">상 · 고등학생~대학생</option>
      </select>
      <p id="note" class="note">일상과 기초 과학을 알아보는 문제예요.</p>
      <button id="start" class="primary full" type="button">퀴즈 시작 🚀</button>
    </section>

    <section id="quiz" class="hidden" aria-labelledby="question">
      <div class="top">
        <span id="counter" class="tag"></span>
        <span id="live-score" aria-live="polite"></span>
      </div>
      <div class="progress" role="progressbar" aria-label="퀴즈 진행률"
           aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <span id="fill"></span>
      </div>
      <h2 id="question" tabindex="-1"></h2>
      <div id="choices" class="choices" role="group" aria-label="답변 선택"></div>
      <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
      <div class="actions">
        <button id="home" class="secondary" type="button">처음으로</button>
        <button id="next" class="primary hidden" type="button">다음 문제 →</button>
      </div>
    </section>

    <section id="result" class="hidden" aria-labelledby="result-title">
      <span class="tag">🎉 도전 완료!</span>
      <h1 id="result-title" tabindex="-1">최종 점수</h1>
      <div id="final" class="big" aria-live="polite"></div>
      <div class="summary">
        <p id="result-level"></p>
        <p id="result-count"></p>
        <p id="message"></p>
      </div>
      <button id="restart" class="primary full" type="button">다시 시작하기 ↻</button>
    </section>
  </main>

  <script>
    "use strict";

    // answer는 0부터 시작하는 정답 선택지의 번호입니다.
    const bank = {
      easy: [
        {
          q: "지구의 자연 위성은 무엇일까요?",
          o: ["태양", "달", "화성", "금성", "북극성"],
          answer: 1,
          why: "달은 지구 주위를 도는 자연 위성입니다. 태양은 별, 화성과 금성은 행성입니다."
        },
        {
          q: "지구에서 면적이 가장 넓은 바다는 무엇일까요?",
          o: ["대서양", "인도양", "북극해", "태평양", "남극해"],
          answer: 3,
          why: "태평양은 지구의 다섯 대양 중 면적이 가장 넓습니다."
        },
        {
          q: "성충 곤충의 다리는 몇 개일까요?",
          o: ["4개", "5개", "6개", "8개", "10개"],
          answer: 2,
          why: "곤충은 다리가 세 쌍, 즉 6개입니다. 거미의 다리 8개와 구별해 보세요."
        },
        {
          q: "표준 대기압에서 순수한 물이 어는 온도는 섭씨 몇 도일까요?",
          o: ["−10°C", "0°C", "10°C", "50°C", "100°C"],
          answer: 1,
          why: "표준 대기압에서 순수한 물의 어는점은 약 0°C입니다."
        },
        {
          q: "일상에서 사용하는 하루는 몇 시간일까요?",
          o: ["12시간", "18시간", "20시간", "24시간", "30시간"],
          answer: 3,
          why: "일상에서 사용하는 하루는 24시간으로 나눕니다."
        },
        { q: "태양계에서 가장 큰 행성은?", o: ["지구", "화성", "목성", "금성", "수성"], answer: 2, why: "목성은 태양계에서 크기가 가장 큰 행성입니다." },
        { q: "광합성을 하는 식물이 주로 흡수하는 기체는?", o: ["산소", "질소", "이산화 탄소", "헬륨", "수소"], answer: 2, why: "식물은 광합성할 때 이산화 탄소를 흡수하고 산소를 방출합니다." },
        { q: "사람이 숨 쉴 때 산소를 받아들이는 기관은?", o: ["위", "폐", "간", "신장", "심장"], answer: 1, why: "폐는 들이마신 공기에서 산소를 받아들이는 호흡 기관입니다." },
        { q: "무지개의 색은 일반적으로 몇 가지로 구분할까요?", o: ["3가지", "5가지", "6가지", "7가지", "9가지"], answer: 3, why: "보통 빨강부터 보라까지 7가지 색으로 구분합니다." },
        { q: "1미터는 몇 센티미터일까요?", o: ["10cm", "50cm", "100cm", "500cm", "1,000cm"], answer: 2, why: "1미터는 100센티미터입니다." },
        { q: "일주일은 며칠일까요?", o: ["5일", "6일", "7일", "8일", "10일"], answer: 2, why: "월요일부터 일요일까지 일주일은 7일입니다." },
        { q: "다음 중 포유류는 무엇일까요?", o: ["개구리", "금붕어", "참새", "돌고래", "나비"], answer: 3, why: "돌고래는 새끼를 낳고 젖을 먹여 기르는 포유류입니다." },
        { q: "물체를 지구 중심 쪽으로 끌어당기는 힘은?", o: ["마찰력", "중력", "자기력", "부력", "탄성력"], answer: 1, why: "중력은 물체를 지구 중심 방향으로 끌어당깁니다." },
        { q: "낮과 밤이 생기는 주된 이유는?", o: ["지구의 자전", "지구의 공전", "달의 자전", "태양의 공전", "바닷물의 흐름"], answer: 0, why: "지구가 스스로 돌면서 태양빛을 받는 쪽과 받지 않는 쪽이 바뀝니다." },
        { q: "다음 중 식물의 뿌리가 하는 일은?", o: ["빛 만들기", "물 흡수하기", "꽃가루 만들기", "열매 날리기", "소리 내기"], answer: 1, why: "뿌리는 땅속의 물과 무기 양분을 흡수합니다." },
        { q: "정삼각형의 변은 몇 개일까요?", o: ["2개", "3개", "4개", "5개", "6개"], answer: 1, why: "정삼각형은 길이가 같은 변 3개로 이루어집니다." },
        { q: "다음 중 자석에 잘 붙는 물질은?", o: ["나무", "종이", "유리", "철", "고무"], answer: 3, why: "철은 자석에 잘 붙는 대표적인 물질입니다." },
        { q: "소리가 전달되지 않는 곳은?", o: ["공기", "물", "철", "진공", "나무"], answer: 3, why: "소리는 전달할 물질이 필요하므로 진공에서는 전달되지 않습니다." },
        { q: "태양은 다음 중 무엇일까요?", o: ["별", "행성", "위성", "혜성", "소행성"], answer: 0, why: "태양은 스스로 빛과 에너지를 내는 별입니다." },
        { q: "물의 화학식은 무엇일까요?", o: ["CO₂", "O₂", "H₂O", "NaCl", "N₂"], answer: 2, why: "물 분자 하나는 수소 원자 2개와 산소 원자 1개로 이루어집니다." }
      ],
      medium: [
        {
          q: "지구 대기에서 가장 많은 비율을 차지하는 기체는?",
          o: ["산소", "이산화 탄소", "질소", "수소", "아르곤"],
          answer: 2,
          why: "건조한 지구 대기에서 질소는 부피 기준 약 78%, 산소는 약 21%입니다."
        },
        {
          q: "나트륨의 원소 기호는 무엇일까요?",
          o: ["N", "Na", "S", "Ne", "K"],
          answer: 1,
          why: "나트륨의 원소 기호는 Na이며, 라틴어 이름 natrium에서 유래했습니다."
        },
        {
          q: "평면 위 삼각형의 세 내각의 합은 얼마일까요?",
          o: ["90°", "120°", "180°", "270°", "360°"],
          answer: 2,
          why: "유클리드 평면 기하에서 삼각형의 세 내각의 합은 180°입니다."
        },
        {
          q: "전류의 SI 기본 단위는 무엇일까요?",
          o: ["볼트", "와트", "옴", "암페어", "줄"],
          answer: 3,
          why: "전류의 SI 기본 단위는 암페어(A)입니다. 볼트는 전압, 옴은 저항의 단위입니다."
        },
        {
          q: "지구의 태양 공전 주기에 가장 가까운 것은?",
          o: ["약 24시간", "약 7일", "약 30일", "약 180일", "약 365일"],
          answer: 4,
          why: "지구의 태양 공전 주기는 약 365.25일로, 약 365일에 가깝습니다."
        },
        { q: "원자 번호 1번인 원소는?", o: ["헬륨", "산소", "수소", "탄소", "질소"], answer: 2, why: "수소는 양성자가 1개인 원소로 원자 번호가 1입니다." },
        { q: "빛이 진공에서 1초 동안 이동하는 거리에 가장 가까운 것은?", o: ["300km", "3,000km", "30,000km", "300,000km", "3,000,000km"], answer: 3, why: "진공에서 빛의 속력은 초당 약 30만 km입니다." },
        { q: "pH 7인 순수한 물은 보통 어떤 성질로 분류할까요?", o: ["강산성", "약산성", "중성", "약염기성", "강염기성"], answer: 2, why: "25°C에서 순수한 물의 pH는 약 7로 중성입니다." },
        { q: "힘의 SI 단위는 무엇일까요?", o: ["뉴턴", "줄", "와트", "파스칼", "볼트"], answer: 0, why: "힘의 SI 유도 단위는 뉴턴(N)입니다." },
        { q: "2³의 값은 얼마일까요?", o: ["5", "6", "8", "9", "12"], answer: 2, why: "2³은 2 × 2 × 2이므로 8입니다." },
        { q: "직각삼각형에서 직각과 마주 보는 변은?", o: ["밑변", "높이", "빗변", "반지름", "대각선"], answer: 2, why: "직각과 마주 보는 가장 긴 변을 빗변이라고 합니다." },
        { q: "세포에서 유전 정보를 저장하는 물질은?", o: ["녹말", "DNA", "포도당", "지방", "물"], answer: 1, why: "DNA에는 생물의 유전 정보가 저장됩니다." },
        { q: "전기 회로에서 저항의 단위는 무엇일까요?", o: ["암페어", "볼트", "와트", "옴", "줄"], answer: 3, why: "전기 저항의 SI 단위는 옴(Ω)입니다." },
        { q: "물의 상태 변화 중 기체가 액체로 바뀌는 것은?", o: ["융해", "기화", "응결", "승화", "응고"], answer: 2, why: "수증기가 식어 물방울이 되는 변화는 응결입니다." },
        { q: "일반적인 사람의 체세포에 있는 염색체 수는?", o: ["12개", "23개", "24개", "46개", "92개"], answer: 3, why: "사람의 일반적인 체세포에는 23쌍, 총 46개의 염색체가 있습니다." },
        { q: "정사각형 한 변의 길이가 4cm라면 넓이는?", o: ["8cm²", "12cm²", "16cm²", "20cm²", "24cm²"], answer: 2, why: "정사각형의 넓이는 한 변 × 한 변이므로 4 × 4 = 16cm²입니다." },
        { q: "지구의 대기에서 구름과 비가 주로 생기는 층은?", o: ["대류권", "성층권", "중간권", "열권", "외기권"], answer: 0, why: "기상 현상은 지표에 가까운 대류권에서 주로 일어납니다." },
        { q: "탄소의 원소 기호는?", o: ["Ca", "Co", "C", "Cl", "Cu"], answer: 2, why: "탄소의 원소 기호는 C이며, Ca는 칼슘입니다." },
        { q: "진공에서 소리가 들리지 않는 이유는?", o: ["빛이 없어서", "전파가 없어서", "전달 매질이 없어서", "온도가 높아서", "중력이 약해서"], answer: 2, why: "소리는 물질의 진동으로 전달되므로 진공에서는 전파되지 않습니다." },
        { q: "평균이 5인 수 2, 4, 6, x에서 x는?", o: ["6", "7", "8", "9", "10"], answer: 2, why: "합이 5 × 4 = 20이어야 하므로 x = 20 − (2 + 4 + 6) = 8입니다." }
      ],
      hard: [
        {
          q: "x > 0일 때 ln(x)의 도함수는?",
          o: ["x", "1/x", "ln(x)", "eˣ", "1/(x²)"],
          answer: 1,
          why: "자연로그 함수 ln(x)를 x에 대해 미분하면 1/x입니다."
        },
        {
          q: "공정한 주사위 두 개의 눈의 합이 7일 확률은?",
          o: ["1/36", "1/12", "1/9", "1/6", "1/4"],
          answer: 3,
          why: "가능한 결과 36가지 중 합이 7인 경우는 6가지이므로 6/36 = 1/6입니다."
        },
        {
          q: "방사성 물질이 두 번의 반감기를 지나면 처음 양의 몇 %가 남을까요?",
          o: ["12.5%", "25%", "33.3%", "50%", "75%"],
          answer: 1,
          why: "첫 반감기 후 1/2, 두 번째 후 1/4이 남으므로 처음 양의 25%입니다."
        },
        {
          q: "질량 M인 천체 중심에서 거리 r인 이상적인 원궤도 공전 속력은? (G: 중력 상수)",
          o: ["GM/r", "√(GM/r)", "√(2GM/r)", "GM/r²", "2πr/GM"],
          answer: 1,
          why: "중력이 구심력 역할을 해 GMm/r² = mv²/r이므로 v = √(GM/r)입니다."
        },
        {
          q: "부모가 모두 Aa일 때 자손이 aa일 확률은? (멘델식 단순 유전)",
          o: ["0%", "12.5%", "25%", "50%", "75%"],
          answer: 2,
          why: "Aa × Aa에서 유전자형의 비율은 AA : Aa : aa = 1 : 2 : 1이므로 aa는 25%입니다."
        },
        { q: "함수 f(x) = x²의 x = 3에서의 도함수 값은?", o: ["3", "4", "6", "9", "12"], answer: 2, why: "f′(x) = 2x이므로 f′(3) = 6입니다." },
        { q: "∫₀¹ 2x dx의 값은?", o: ["0", "1/2", "1", "2", "4"], answer: 2, why: "2x의 부정적분은 x²이므로 1² − 0² = 1입니다." },
        { q: "복소수 i의 제곱은?", o: ["−1", "0", "1", "i", "2i"], answer: 0, why: "허수 단위 i는 i² = −1로 정의합니다." },
        { q: "표준 정규분포의 평균과 표준편차는?", o: ["0과 0", "0과 1", "1과 0", "1과 1", "0과 2"], answer: 1, why: "표준 정규분포의 평균은 0, 표준편차는 1입니다." },
        { q: "행렬 [[1, 2], [3, 4]]의 행렬식은?", o: ["−2", "−1", "0", "2", "10"], answer: 0, why: "2×2 행렬의 행렬식은 ad − bc이므로 1×4 − 2×3 = −2입니다." },
        { q: "진공에서 빛의 속력에 가장 가까운 값은?", o: ["3×10⁵ m/s", "3×10⁶ m/s", "3×10⁷ m/s", "3×10⁸ m/s", "3×10⁹ m/s"], answer: 3, why: "진공에서 빛의 속력은 약 2.998×10⁸ m/s입니다." },
        { q: "광자 한 개의 에너지를 나타내는 식은? (h: 플랑크 상수, f: 진동수)", o: ["hf", "h/f", "f/h", "h+f", "h²f"], answer: 0, why: "광자의 에너지는 진동수에 비례하며 E = hf입니다." },
        { q: "절대온도 0 K는 섭씨 몇 도일까요?", o: ["−100°C", "−273.15°C", "0°C", "100°C", "273.15°C"], answer: 1, why: "섭씨온도는 절대온도에서 273.15를 뺀 값이므로 0 K는 −273.15°C입니다." },
        { q: "수소 원자의 원자 번호는?", o: ["0", "1", "2", "3", "4"], answer: 1, why: "원자 번호는 양성자 수이며 수소 원자는 양성자 1개를 가집니다." },
        { q: "25°C에서 순수한 물의 수소 이온 지수(pH)는 약 얼마일까요?", o: ["1", "3", "5", "7", "14"], answer: 3, why: "25°C에서 순수한 물은 중성이며 pH는 약 7입니다." },
        { q: "DNA 이중 나선에서 아데닌(A)과 주로 짝을 이루는 염기는?", o: ["구아닌(G)", "시토신(C)", "티민(T)", "우라실(U)", "리보스"], answer: 2, why: "DNA에서 아데닌은 티민과 상보적으로 결합합니다." },
        { q: "멘델의 독립의 법칙이 일반적으로 적용되는 경우는?", o: ["항상 모든 유전자", "서로 다른 염색체에 있는 유전자", "같은 위치의 대립유전자", "미토콘드리아 DNA만", "세균의 단일 유전자"], answer: 1, why: "서로 다른 염색체에 있는 유전자는 감수 분열에서 대체로 독립적으로 분리됩니다." },
        { q: "해수면 부근 표준 대기압에 가장 가까운 값은?", o: ["1.013 Pa", "101.3 Pa", "1,013 Pa", "101,325 Pa", "10,132,500 Pa"], answer: 3, why: "표준 대기압은 101,325 Pa, 즉 약 101.3 kPa입니다." },
        { q: "SI 단위계에서 에너지의 단위는?", o: ["뉴턴", "줄", "와트", "파스칼", "쿨롱"], answer: 1, why: "에너지와 일의 SI 단위는 줄(J)입니다." },
        { q: "원 안에 내접하는 사각형의 마주 보는 두 각의 합은?", o: ["90°", "120°", "180°", "270°", "360°"], answer: 2, why: "원에 내접하는 사각형의 대각 두 개의 합은 180°입니다." }
      ]
    };

    const names = {
      easy: "하 · 초등학생",
      medium: "중 · 중학생",
      hard: "상 · 고등학생~대학생"
    };
    const notes = {
      easy: "일상과 기초 과학을 알아보는 문제예요.",
      medium: "중학교 과학·수학의 핵심 개념을 확인해요.",
      hard: "고등학교~대학 수준의 개념과 계산에 도전해요."
    };
    const $ = id => document.getElementById(id);

    let level = "easy";
    let position = 0;
    let score = 0;
    let answered = false;
    let round = [];
    const remaining = { easy: [], medium: [], hard: [] };
    const lastPlayed = { easy: [], medium: [], hard: [] };

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function drawQuestions(difficulty) {
      const picked = [];
      while (picked.length < 5) {
        if (!remaining[difficulty].length) {
          // 새 묶음으로 넘어갈 때 직전 회차와 현재 회차의 문제는 제외합니다.
          const avoid = new Set([...lastPlayed[difficulty], ...picked]);
          remaining[difficulty] = shuffle(bank[difficulty].filter(item => !avoid.has(item)));
        }
        picked.push(remaining[difficulty].pop());
      }
      lastPlayed[difficulty] = picked;
      return picked;
    }

    function show(target) {
      ["intro", "quiz", "result"].forEach(id => {
        $(id).classList.toggle("hidden", id !== target);
      });
    }

    function progress(count) {
      $("fill").style.width = `${count * 20}%`;
      $("fill").parentElement.setAttribute("aria-valuenow", String(count));
    }

    function render() {
      answered = false;
      const item = round[position];

      $("counter").textContent = `문제 ${position + 1} / 5 · ${names[level]}`;
      $("live-score").textContent = `현재 ${score}점`;
      $("question").textContent = item.q;
      progress(position);

      $("feedback").className = "feedback hidden";
      $("feedback").replaceChildren();
      $("next").classList.add("hidden");
      $("choices").replaceChildren();

      item.o.forEach((option, i) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice";
        button.setAttribute("aria-label", `${"ABCDE"[i]}번, ${option}`);

        const letter = document.createElement("span");
        letter.className = "letter";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = "ABCDE"[i];

        const text = document.createElement("span");
        text.textContent = option;

        button.append(letter, text);
        button.addEventListener("click", () => choose(i));
        $("choices").append(button);
      });

      $("question").focus();
    }

    function choose(selected) {
      if (answered) return;
      answered = true;

      const item = round[position];
      const correct = selected === item.answer;
      if (correct) score += 20;

      $("live-score").textContent = `현재 ${score}점`;

      [...$("choices").children].forEach((button, i) => {
        button.disabled = true;
        if (i === item.answer) button.classList.add("correct");
        if (i === selected && !correct) button.classList.add("wrong");
      });

      const box = $("feedback");
      box.className = `feedback ${correct ? "good" : "bad"}`;

      const heading = document.createElement("strong");
      heading.textContent = correct
        ? "정답! +20점 🎉"
        : `아쉬워요! 정답: ${"ABCDE"[item.answer]}번 · ${item.o[item.answer]}`;

      const explanation = document.createElement("p");
      explanation.textContent = `해설: ${item.why}`;

      box.append(heading, explanation);
      progress(position + 1);

      $("next").textContent = position === 4 ? "결과 보기 →" : "다음 문제 →";
      $("next").classList.remove("hidden");
      $("next").focus();
    }

    function finish() {
      show("result");
      $("final").textContent = `${score} / 100점`;
      $("result-level").textContent = `선택 난이도: ${names[level]}`;
      $("result-count").textContent = `맞힌 문제: ${score / 20} / 5`;
      $("message").textContent = score === 100
        ? "완벽해요! 지식 탐험 대성공! 🏆"
        : score >= 60
          ? "잘했어요! 다른 난이도에도 도전해 보세요. 🌟"
          : "해설을 떠올리며 다시 도전해 보세요! 💪";
      $("result-title").focus();
    }

    function reset() {
      position = 0;
      score = 0;
      answered = false;
      show("intro");
      $("start").focus();
    }

    $("difficulty").addEventListener("change", () => {
      $("note").textContent = notes[$("difficulty").value];
    });
    $("start").addEventListener("click", () => {
      level = $("difficulty").value;
      round = drawQuestions(level);
      position = 0;
      score = 0;
      show("quiz");
      render();
    });
    $("next").addEventListener("click", () => {
      if (!answered) return;
      if (position === 4) finish();
      else {
        position++;
        render();
      }
    });
    $("home").addEventListener("click", reset);
    $("restart").addEventListener("click", reset);
  </script>
</body>
</html>
